[versions]
agp = "9.1.1"
kotlin = "2.2.10"
coreKtx = "1.18.0"
composeBom = "2026.09.00"
material3 = "1.5.0-alpha29"
lifecycle = "2.10.0"
activityCompose = "1.10.1"
datastore = "1.1.7"
coroutines = "1.10.2"
digitalInk = "18.1.0"
junit = "4.13.2"
